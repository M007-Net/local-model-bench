services:
  local-model-bench:
    image: local-model-bench:web
    build: .
    ports:
      - "${LMB_BIND_ADDRESS:-127.0.0.1}:${LMB_PORT:-8080}:8080"
    environment:
      LMB_WEB_TOKEN: "${LMB_WEB_TOKEN:-}"
      LMB_ALLOWED_HOSTS: "${LMB_ALLOWED_HOSTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bench-data:/data
    init: true
    stop_grace_period: 2m
    restart: unless-stopped
volumes:
  bench-data:
    name: "${LMB_VOLUME_NAME:-local-model-bench-data}"
