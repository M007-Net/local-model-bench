name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # package.json declares "node": ">=22", so the floor is tested alongside a newer
      # release. Testing only the newest leaves the declared floor to rot unnoticed.
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs rather than tags, because a tag can be
      # moved to point at different code. Dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The lockfile is what `npm ci` installs from, so a change to package.json
      # without a regenerated lockfile would install something other than what it
      # claims to.
      - name: Lockfile is in sync
        run: git diff --exit-code -- package-lock.json
      # The build regenerates the bundled-dependency notices. If that changes the
      # committed file, a dependency moved without its notice following, and the
      # installer would ship MIT/ISC code without the notice those licences require.
      - name: Third-party notices are current
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt

  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Advisories against shipped dependencies fail the build. Dev-only ones are
      # reported without failing it, since they do not reach a user's machine.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit everything (advisory only)
        continue-on-error: true
        run: npm audit --audit-level=moderate
